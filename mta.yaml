_schema-version: 3.3.0
ID: Library
description: A simple CAP project.
version: 1.0.0
modules:
- name: Library-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: Library-auth
  - name: Library-connectivity
  - name: Library-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: Library-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: Library-db
  parameters:
    buildpack: nodejs_buildpack
- name: Library-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: Library-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - comdhruvlistobjectlibrary.zip
      name: comdhruvlistobjectlibrary
      target-path: resources/
    - artifacts:
      - comdhruvlibraryoverview.zip
      name: comdhruvlibraryoverview
      target-path: resources/
    - artifacts:
      - comdhruvlibraryanalytics.zip
      name: comdhruvlibraryanalytics
      target-path: resources/
    - artifacts:
      - comdhruvloanmanagement.zip
      name: comdhruvloanmanagement
      target-path: resources/
    - artifacts:
      - comdhruvnotificationsui.zip
      name: comdhruvnotificationsui
      target-path: resources/
- name: comdhruvlistobjectlibrary
  type: html5
  path: app/list_object_library
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: comdhruvlibraryoverview
  type: html5
  path: app/library-overview
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: comdhruvlibraryanalytics
  type: html5
  path: app/library-analytics
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: comdhruvloanmanagement
  type: html5
  path: app/loan-management
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: comdhruvnotificationsui
  type: html5
  path: app/notifications-ui
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: Library-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: Library-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: Library-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite
- name: Library-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: Library-ans
  type: org.cloudfoundry.managed-service
  parameters:
    service-name: Library-ANS
    service-plan: standard
    service: alert-notification
- name: Library-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: Library-html5-service
    service-plan: app-host
- name: Library-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: Library-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
